[package]
name = "bpsr-protocol"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
prost = { workspace = true }
bytes = { workspace = true }
zstd = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Only used by the offline replay/inspect binary (src/bin/inspect-replay.rs,
# issue #25 slice B) to parse the dump.jsonl format documented in
# crates/app/src/dump.rs. Already resolved workspace-wide (crates/app uses
# both), so this adds no new external dependency to the lockfile.
serde = { workspace = true }
serde_json = { workspace = true }
# Used by `src/map.rs`, the shared bpsr_protocol -> bpsr_meter event mapper
# (`bpsr-app`'s pipeline and the offline sanitizer binary,
# src/bin/sanitize-dump.rs, both call into it), and by that binary's
# mandatory self-check gate: replaying both the original and sanitized
# record streams through `bpsr_meter::Meter` and comparing snapshot
# fingerprints. `bpsr-meter` has no dependency back on this crate, so this
# is not a cycle.
bpsr-meter = { workspace = true }

[dev-dependencies]
bpsr-test-support = { workspace = true }
