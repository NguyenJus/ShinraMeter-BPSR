[package]
name = "bpsr-capture"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
thiserror = { workspace = true }
etherparse = { workspace = true }
crossbeam-channel = { workspace = true }
log = { workspace = true }
bpsr-protocol = { workspace = true }

[target.'cfg(windows)'.dependencies]
windivert = { workspace = true, features = ["vendored"] }
# Raw FFI: `stop()` needs the `Copy` OS HANDLE so it can call
# `WinDivertShutdown` while the capture thread is blocked in a recv on the
# same handle — the safe wrapper keeps its handle private and takes
# `&mut self`, which cannot be produced soundly there.
windivert-sys = { workspace = true, features = ["vendored"] }
windows = { workspace = true }
