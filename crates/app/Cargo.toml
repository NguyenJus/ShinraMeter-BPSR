[package]
name = "ShinraMeter-BPSR"
version = "0.2.3"
edition = "2024"
license = "GPL-3.0-only"

[[bin]]
name = "ShinraMeter-BPSR"
path = "src/main.rs"

[lib]
name = "bpsr_app"
path = "src/lib.rs"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
# Issue #89: only for `egui_winit::set_no_redirection_bitmap`, the opt-in added
# by the vendored fork in `third_party/egui-winit` (see the `[patch.crates-io]`
# entry in the workspace manifest). eframe re-exports neither the crate nor the
# function, so `main.rs` has to name it directly.
egui-winit = { workspace = true }
# Issue #89: blocks on `wgpu::Instance::enumerate_adapters` for the DX12 probe
# in `main.rs`.
pollster = { workspace = true }
arboard = { workspace = true }
image = { workspace = true }
crossbeam-channel = { workspace = true }
bpsr-meter = { workspace = true }
bpsr-capture = { workspace = true }
bpsr-protocol = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The Aero Snap workaround, the saved-position clamp and the minimize-to-tray
# support (see `src/platform.rs`) need the raw HWND, the Win32 window-style
# APIs, the monitor-enumeration/work-area APIs and the notification-area APIs
# — none of which egui/eframe expose.
raw-window-handle = { workspace = true }
windows = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # `SetWindowSubclass`/`DefSubclassProc` for the Snap-blocking subclass
    # in `src/platform.rs` (`install_snap_blocker`) — despite living in
    # comctl32 at the C-API level, win32metadata places these under the
    # `Shell` namespace, not `Controls`. Also `Shell_NotifyIconW` /
    # `NOTIFYICONDATAW` for the tray icon (`install_tray`, issue #53).
    "Win32_UI_Shell",
    # `GetDpiForWindow`, so the tray's "Reset Window" can turn `ui::viewport`'s
    # default inner size (egui points) into the physical pixels
    # `SetWindowPos` wants (issue #53).
    "Win32_UI_HiDpi",
    # `GetModuleHandleW`, to look up the executable's own icon resource for
    # the tray entry (issue #53).
    "Win32_System_LibraryLoader",
    # `WinHttpOpen`/`WinHttpConnect`/`WinHttpSendRequest`/etc. for the
    # header dropdown's manual "Check for updates" GET against GitHub's
    # releases API (`src/platform.rs::http_get`, issue #171).
    "Win32_Networking_WinHttp",
    # `GetSaveFileNameW`/`OPENFILENAMEW` for the header dropdown's "Export
    # logs" save-location dialog (`src/platform.rs::choose_log_export_path`,
    # issue #220) — the classic common dialog, not `IFileSaveDialog`, so no
    # COM feature is needed alongside it.
    "Win32_UI_Controls_Dialogs",
] }

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
bpsr-test-support = { workspace = true }
# Only for decompressing crates/app/tests/fixtures/*.jsonl.zst (sanitized
# replay fixtures produced by bpsr-protocol's sanitize-dump binary) in
# integration tests. Already a workspace dependency of bpsr-protocol itself
# (frame decompression), so this adds no new entry to the lockfile.
zstd = { workspace = true }
