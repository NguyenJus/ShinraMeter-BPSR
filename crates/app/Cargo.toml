[package]
name = "shinra-bpsr"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[[bin]]
name = "shinra-bpsr"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
crossbeam-channel = { workspace = true }
bpsr-meter = { workspace = true }
bpsr-capture = { workspace = true }
bpsr-protocol = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The Aero Snap workaround (see `src/platform.rs`) needs the raw HWND and
# the Win32 window-style APIs, neither of which egui/eframe expose.
raw-window-handle = { workspace = true }
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
bpsr-test-support = { workspace = true }
