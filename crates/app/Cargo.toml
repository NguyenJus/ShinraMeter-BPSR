[package]
name = "shinra-bpsr"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[[bin]]
name = "shinra-bpsr"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
crossbeam-channel = { workspace = true }
bpsr-meter = { workspace = true }
bpsr-capture = { workspace = true }
bpsr-protocol = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The Aero Snap workaround and the saved-position clamp (see
# `src/platform.rs`) need the raw HWND, the Win32 window-style APIs, and
# (for the position clamp) the monitor-enumeration/work-area APIs — none of
# which egui/eframe expose.
raw-window-handle = { workspace = true }
windows = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
bpsr-test-support = { workspace = true }
