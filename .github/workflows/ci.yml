name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check
      # Issue #249: the release-staging script is shell, so `cargo test`
      # cannot reach it. Its own tests run here — the cheapest job on the
      # board, and one that needs no toolchain beyond bash — so a naming
      # regression in the one step a tag push runs unattended is caught on
      # the PR instead of after the tag is already published.
      - run: scripts/package-release.test.sh

  # Linting for the Windows target needs no *linker* (no final link step), but
  # build scripts still run: `zstd-sys` compiles C, and the app crate's
  # `build.rs` runs `windres` to embed the UAC manifest — so cc-rs and
  # embed-resource both demand the mingw-w64 cross-toolchain named by
  # `.cargo/config.toml`.
  clippy:
    runs-on: ubuntu-latest
    # Well clear of a good run (~2m) but far short of the 360-minute default,
    # so a wedged step can never sit on a PR for an hour again.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # clippy and build-windows deliberately restore this cache independently
      # rather than serialising behind a shared "populate" job. On a key miss
      # both run the download path concurrently, which is real duplicated work
      # — and misses are now routine rather than rare, because the key carries
      # the runner image version and so rotates whenever GitHub rebuilds the
      # image (roughly weekly). The trade is still lopsided: a miss costs ~15s
      # of apt download in each job, while a `needs:` on a populate job would
      # add that job's whole startup (~16s end to end for a trivial job here,
      # measured on `fmt`) to the critical path of *every* run, hits included,
      # and the two consumers would still each run their own cache restore.
      # Revisit if the package set grows large enough that the download stops
      # being seconds, if mirror flakiness starts failing jobs outright, or if
      # a third consumer appears.
      - name: Install the mingw-w64 cross-toolchain
        uses: ./.github/actions/mingw-w64-toolchain
        timeout-minutes: 15
      - run: |
          rustup component add clippy
          rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu

  # The release link is the only place the embedded manifest and the absence
  # of a load-time WinDivert import can actually be observed, so assert them
  # here rather than discovering a regression on a user's machine.
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Restores the same cache as `clippy`, independently and in parallel; see
      # the note there for why the duplicated download on a miss is accepted.
      - name: Install the mingw-w64 cross-toolchain
        uses: ./.github/actions/mingw-w64-toolchain
        timeout-minutes: 15
      - run: rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Assert the executable needs no registered DLL and self-elevates
        run: |
          set -euo pipefail
          exe=target/x86_64-pc-windows-gnu/release/ShinraMeter-BPSR.exe
          if x86_64-w64-mingw32-objdump -p "$exe" | grep -qi 'DLL Name: WinDivert'; then
            echo "::error::WinDivert is linked at load time; the exe needs WinDivert.dll beside it"
            exit 1
          fi
          if ! strings -a "$exe" | grep -q 'requireAdministrator'; then
            echo "::error::the UAC manifest is missing from the executable"
            exit 1
          fi
      # Issue #249: the release asset is the bare executable, not a zip
      # around it. Nothing is versioned here — a branch build has no tag to
      # version with — but this still runs the same script release.yml does,
      # so a change that breaks the staging step fails on the PR rather than
      # on the tag push. `upload-artifact` zips whatever it is given for the
      # browser download either way, so dropping our own zip costs the CI
      # artifact nothing.
      - name: Stage the release asset
        run: |
          scripts/package-release.sh \
            target/x86_64-pc-windows-gnu/release/ShinraMeter-BPSR.exe \
            ShinraMeter-BPSR-windows-x64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: ShinraMeter-BPSR-windows-x64
          path: ShinraMeter-BPSR-windows-x64.exe

  # Host-target tests for the whole workspace, app crate included. The app
  # crate used to be excluded on the assumption that egui/eframe would drag in
  # Linux GUI system deps; it does not — winit, wgpu and arboard all reach
  # their X11/Wayland libraries through `dlopen`, so the test binary links
  # against libc alone and its tests (which never open a window) run headless.
  # Excluding it left every `#[cfg(test)]` module in the app crate untested,
  # including the issue #89 window-composition decision.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Issue #341: every other job builds *for* Windows without ever running the
  # result — cross-compiled from Linux (build-windows) or checked without
  # linking (clippy). Nothing has ever launched the actual exe on the actual
  # OS, so a Windows-only regression (a Win32 API call that compiles but
  # misbehaves, a manifest that fails to load, a startup panic) would only
  # ever be caught by a user. This builds natively on `windows-latest` — no
  # mingw cross-toolchain, the host default is `x86_64-pc-windows-msvc` and
  # the runner ships the Windows SDK's `rc.exe` that `embed-resource` needs
  # for the manifest — then runs the exe with `--version`, which `main.rs`
  # now checks for before opening a window or touching the single-instance
  # lock. The shipped manifest's `requireAdministrator` is honored by the
  # Windows loader at `CreateProcess`, before `main` ever runs, so
  # `--version` cannot avoid the elevation prompt itself — this smoke test
  # only passes because hosted `windows-latest` runners already run with a
  # full admin token; `--version` merely avoids the window and the
  # single-instance lock.
  windows-smoke:
    runs-on: windows-latest
    # Cold thin-LTO + codegen-units=1 release build on a 4-core Windows
    # runner is the slow case here; rust-cache keeps warm runs well under
    # this, but a cache miss needs the headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ShinraMeter-BPSR
      - name: Run the built exe with --version
        shell: pwsh
        run: |
          # Start-Process -Wait blocks regardless of subsystem, -PassThru
          # exposes the real exit code, and -RedirectStandardOutput gives
          # the GUI-subsystem child a real stdout to write the banner to.
          $p = Start-Process -FilePath .\target\release\ShinraMeter-BPSR.exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput version.txt
          Get-Content version.txt
          if ($p.ExitCode -ne 0) { throw "ShinraMeter-BPSR.exe --version exited with $($p.ExitCode)" }
          if (-not (Select-String -Path version.txt -Pattern '^ShinraMeter-BPSR \d+\.\d+\.\d+' -Quiet)) { throw "--version did not print the expected banner" }

  # Issue #341: fails the PR on a known-vulnerable/unmaintained advisory or a
  # license outside `deny.toml`'s allow list, rather than letting either slip
  # in unnoticed with the rest of a dependency bump.
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # The action's default `arguments` is `--all-features`, which
          # would override deny.toml's `all-features = false`.
          command: check
          arguments: ""
