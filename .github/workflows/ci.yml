name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  # Linting for the Windows target needs no *linker* (no final link step), but
  # `zstd-sys` compiles C in its build script, so cc-rs still demands the
  # mingw-w64 cross-compiler named by `.cargo/config.toml`.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: |
          rustup component add clippy
          rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu

  # Host-target tests for the pure crates. The app crate is egui/eframe and
  # would drag in Linux GUI system deps, so it is excluded.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude shinra-bpsr
