name: Release

# Tagged versions publish a zip containing the Windows executable — every
# icon set (including the class and Imagine icons) is compiled in via
# `include_bytes!` (issue #123), so there is no separate asset tree to ship.
# The build mirrors the `build-windows` job in ci.yml — same cross-toolchain,
# same checks — so a tag can never ship a binary CI would have rejected.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Generous on purpose. This cap wraps the toolchain install (bounded at 15
    # minutes by the step below), rustup, a cross-compile of a 468-crate
    # dependency tree that may miss the rust-cache entirely, packaging, and the
    # upload. The last release run took 6m45s end to end with a 6m01s cargo
    # build and a rust-cache restore that completed in 2s (i.e. essentially
    # cold), so ~22 minutes is the plausible bad-day sum — but that is an
    # estimate built on one observation, not a measured worst case, so this
    # leaves roughly 2.5x on top of it. A killed release job is worse than a
    # killed CI job: the tag is already pushed and the whole thing needs a
    # manual re-trigger. Still 6x below the 360-minute default, so a genuinely
    # wedged job cannot sit here for hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Same composite action as CI, so a tag build can never diverge from the
      # toolchain `build-windows` verified. The action asserts every
      # cross-binary works before cargo runs, so a degraded cache restore
      # fails the release rather than shipping a quietly different binary.
      - name: Install the mingw-w64 cross-toolchain
        uses: ./.github/actions/mingw-w64-toolchain
        timeout-minutes: 15
      - run: rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Assert the executable needs no registered DLL and self-elevates
        run: |
          set -euo pipefail
          exe=target/x86_64-pc-windows-gnu/release/ShinraMeter-BPSR.exe
          if x86_64-w64-mingw32-objdump -p "$exe" | grep -qi 'DLL Name: WinDivert'; then
            echo "::error::WinDivert is linked at load time; the exe needs WinDivert.dll beside it"
            exit 1
          fi
          if ! strings -a "$exe" | grep -q 'requireAdministrator'; then
            echo "::error::the UAC manifest is missing from the executable"
            exit 1
          fi

      # A version in the asset name keeps downloads distinguishable once a
      # user has several of them in one folder.
      - name: Stage the release asset
        run: |
          set -euo pipefail
          scripts/package-release.sh \
            target/x86_64-pc-windows-gnu/release/ShinraMeter-BPSR.exe \
            "ShinraMeter-BPSR-${GITHUB_REF_NAME}-windows-x64.zip"

      # Tags carrying a pre-release suffix (v0.2.0-rc1) publish as pre-releases
      # so they stay off the repository's "latest release" link.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "ShinraMeter-BPSR-${GITHUB_REF_NAME}-windows-x64.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
