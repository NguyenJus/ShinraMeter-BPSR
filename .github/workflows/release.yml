name: Release

# Tagged versions publish the Windows executable. The build mirrors the
# `build-windows` job in ci.yml — same cross-toolchain, same self-contained
# assertions — so a tag can never ship a binary CI would have rejected.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - run: rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Assert the executable is self-contained
        run: |
          set -euo pipefail
          exe=target/x86_64-pc-windows-gnu/release/shinra-bpsr.exe
          if x86_64-w64-mingw32-objdump -p "$exe" | grep -qi 'DLL Name: WinDivert'; then
            echo "::error::WinDivert is linked at load time; the exe needs WinDivert.dll beside it"
            exit 1
          fi
          if ! strings -a "$exe" | grep -q 'requireAdministrator'; then
            echo "::error::the UAC manifest is missing from the executable"
            exit 1
          fi

      # A version in the asset name keeps downloads distinguishable once a
      # user has several of them in one folder.
      - name: Stage the release asset
        run: |
          set -euo pipefail
          cp target/x86_64-pc-windows-gnu/release/shinra-bpsr.exe \
             "shinra-bpsr-${GITHUB_REF_NAME}-windows-x64.exe"

      # Tags carrying a pre-release suffix (v0.2.0-rc1) publish as pre-releases
      # so they stay off the repository's "latest release" link.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "shinra-bpsr-${GITHUB_REF_NAME}-windows-x64.exe" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
